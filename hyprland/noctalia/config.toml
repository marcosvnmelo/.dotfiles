[audio]
enable_overdrive = true

[bar.default]
background_opacity = 0.84999998100101948
center = [ "active_window" ]
end = [ "tray", "notifications", "brightness", "battery", "group:g3", "bluetooth", "network", "group:g2", "widget" ]
scale = 1.0500000081956387
start = [ "group:g4", "media", "group:g1" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "sysmon", "temp", "ram", "network_rx" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "clock" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "volume", "input_volume" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g4"
    members = [ "workspaces" ]
    opacity = 1.0
    padding = 6.0

[desktop_widgets]
enabled = false

[hooks]
session_locked = "systemctl --user stop wayland-pipewire-idle-inhibit.service"
session_unlocked = "systemctl --user start wayland-pipewire-idle-inhibit.service"

[idle]
behavior_order = [ "screen-off", "lock", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 60.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    locked_timeout = 10.0
    timeout = 50.0

[location]
address = "Paranaita, MT, Brazil"

[lockscreen]
monitors = [ "eDP-1" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 800.0
    cy = 718.0
    output = "eDP-1"
    placement_height = 900.0
    placement_width = 1600.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd]
monitors = [ "eDP-1" ]

    [osd.kinds]
    media = false

[plugins]
enabled = [ "alexander/screen-toolkit" ]

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 0.0
enabled = true
shortcut = "1"
variant = "destructive"

[[shell.session.actions]]
action = "reboot"
countdown_seconds = 0.0
enabled = true
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "command"
command = "~/.local/bin/session-action.sh rebootToUefi"
countdown_seconds = 0.0
enabled = true
glyph = "reboot"
label = "Reboot to UEFI"
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "command"
command = "~/.local/bin/session-action.sh suspend"
countdown_seconds = 0.0
enabled = true
glyph = "player-pause"
label = "Suspend"
shortcut = "4"
variant = "default"

[[shell.session.actions]]
action = "logout"
countdown_seconds = 0.0
enabled = true
shortcut = "5"
variant = "default"

[[shell.session.actions]]
action = "lock"
countdown_seconds = 0.0
enabled = false
shortcut = "1"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
countdown_seconds = 0.0
enabled = false
shortcut = "3"
variant = "default"

[theme]
builtin = "Kanagawa"
community_palette = "Kanagawa Dragon"
source = "community"

[wallpaper]
directory = "/home/marcos/.dotfiles/hyprland/wallpapers"

    [wallpaper.default]
    path = "/home/marcos/.dotfiles/hyprland/wallpapers/kanagawa_dragon.png"

    [wallpaper.last]
    path = "/home/marcos/.dotfiles/hyprland/wallpapers/kanagawa_dragon.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/marcos/.dotfiles/hyprland/wallpapers/kanagawa_dragon.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/marcos/.dotfiles/hyprland/wallpapers/kanagawa_dragon.png"

[widget.battery]
hide_when_full = true

[widget.brightness]
show_label = false

[widget.clock]
format = "{:%-I:%M %P}, {:%a}"

[widget.input_volume]
show_label = false

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.network_rx]
visualization = "none"

[widget.ram]
show_value = false

[widget.sysmon]
show_value = false

[widget.temp]
show_value = false

[widget.tray]
drawer = true

[widget.volume]
show_label = false

[widget.widget]
type = "alexander/screen-toolkit:widget"
